<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡迎互動看板 | Welcome Board</title>
    <!-- Importing modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fullscreen Interactive Particle Canvas -->
    <canvas id="bgCanvas"></canvas>
    
    <!-- Fullscreen Sparkle Effect Canvas -->
    <canvas id="effectCanvas"></canvas>

    <!-- Corner Time & Date Widget -->
    <div class="time-widget glass-widget">
        <div class="time-row">
            <span id="widgetTime" class="widget-time">--:--:--</span>
            <span id="widgetPeriod" class="widget-period">AM</span>
        </div>
        <div id="widgetDate" class="widget-date">----年--月--日 星期-</div>
    </div>

    <!-- Main Content Container -->
    <div class="welcome-container">
        <div class="welcome-card glass-card" id="welcomeCard">
            <div class="card-glow"></div>
            <div class="card-content">
                <!-- Glowing Title -->
                <h1 id="welcomeTitle" class="welcome-title neon-text">歡迎光臨</h1>
                
                <!-- Elegant Subtitle -->
                <p id="welcomeSubtitle" class="welcome-subtitle">熱烈歡迎各位貴賓蒞臨 ✨</p>
                
                <!-- Gentle Hint -->
                <div class="interaction-hint">
                    <span>點擊畫面以互動 🎵</span>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
