<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lab 2 - 照相亭">
    <title>Lab 2 | 照相亭</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
        body {
            margin: 0; padding: 0; font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #2C3E50, #000000);
            color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 3rem; text-align: center; backdrop-filter: blur(15px); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 600px; width: 90%;
            animation: fadeIn 0.8s ease-out;
        }
        h1 { margin-top: 0; color: #FFD700; font-size: 2.5rem; }
        p { line-height: 1.6; color: #dcdcdc; }
        .back-link {
            display: inline-block; margin-top: 2rem; color: #fff; text-decoration: none; 
            padding: 12px 24px; background: rgba(255, 215, 0, 0.2); border-radius: 8px; 
            transition: 0.3s; font-weight: 600; border: 1px solid rgba(255, 215, 0, 0.5);
        }
        .back-link:hover { background: rgba(255, 215, 0, 0.6); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 照相亭</h1>
        <p>歡迎來到 Lab 2 的照相亭。<br>擺好姿勢，捕捉最美好的一刻！功能即將上線。</p>
        <a href="../index.html" class="back-link">← 回到主頁</a>
    </div>
</body>
</html>
