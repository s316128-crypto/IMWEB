<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMWEB 互動網頁設計</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05050d;
            --nav-height: 70px;
            --primary: #00f2fe;
            --secondary: #4facfe;
            --text: #fff;
            --text-muted: rgba(255,255,255,0.5);
            --glass: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.08);
            --active-bg: rgba(0,242,254,0.12);
            --active-border: rgba(0,242,254,0.5);
            --font: 'Outfit', 'Inter', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font);
            color: var(--text);
        }

        /* ── Nav Bar ────────────────────────────── */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--nav-height);
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 2rem;
            gap: 0.5rem;
            background: rgba(5,5,13,0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-brand {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0,242,254,0.4);
            margin-right: 1.5rem;
            white-space: nowrap;
        }

        .nav-tabs {
            display: flex;
            gap: 0.4rem;
            flex: 1;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.2rem;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: var(--font);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .tab-btn:hover {
            background: var(--glass);
            color: var(--text);
            border-color: var(--glass-border);
        }

        .tab-btn.active {
            background: var(--active-bg);
            color: var(--primary);
            border-color: var(--active-border);
            text-shadow: 0 0 8px rgba(0,242,254,0.3);
        }

        .tab-btn .tab-num {
            font-size: 0.7rem;
            font-weight: 800;
            padding: 0.1rem 0.4rem;
            border-radius: 5px;
            background: rgba(255,255,255,0.08);
        }

        .tab-btn.active .tab-num {
            background: rgba(0,242,254,0.2);
            color: var(--primary);
        }

        /* ── Content Area ───────────────────────── */
        .content-area {
            position: fixed;
            top: var(--nav-height);
            left: 0; right: 0; bottom: 0;
        }

        /* Home Panel */
        .home-panel {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem;
            position: relative;
        }

        canvas#homeBg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .home-text {
            position: relative;
            text-align: center;
            z-index: 1;
        }

        .home-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 5px;
            padding: 0.3rem 1rem;
            border-radius: 50px;
            border: 1px solid rgba(0,242,254,0.3);
            color: var(--primary);
            background: rgba(0,242,254,0.07);
            margin-bottom: 1rem;
        }

        .home-title {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 20%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.75rem;
            filter: drop-shadow(0 0 20px rgba(0,242,254,0.2));
        }

        .home-sub {
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            margin-bottom: 2.5rem;
        }

        /* Quick-access cards on home */
        .quick-grid {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            max-width: 800px;
            width: 100%;
        }

        .quick-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            padding: 1.5rem 1rem;
            border-radius: 16px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .quick-card:hover {
            background: rgba(0,242,254,0.07);
            border-color: rgba(0,242,254,0.3);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .quick-card .qc-num {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--text-muted);
        }

        .quick-card .qc-icon { font-size: 1.8rem; }

        .quick-card .qc-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
        }

        .quick-card.featured {
            border-color: rgba(0,242,254,0.25);
            background: rgba(0,242,254,0.05);
        }

        /* iFrame panels */
        .frame-panel {
            width: 100%;
            height: 100%;
            display: none;
        }

        .frame-panel.active {
            display: block;
        }

        .frame-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ── Mobile responsive ─────────────── */
        @media (max-width: 640px) {
            nav { padding: 0 1rem; }
            .nav-brand { display: none; }
            .quick-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <span class="nav-brand">IMWEB</span>
        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="home" id="tab-home">
                <span class="tab-num">🏠</span> 首頁
            </button>
            <button class="tab-btn" data-tab="lab1" id="tab-lab1">
                <span class="tab-num">01</span> 流行猜歌王
            </button>
            <button class="tab-btn" data-tab="lab2" id="tab-lab2">
                <span class="tab-num">02</span> 照相亭
            </button>
            <button class="tab-btn" data-tab="lab3" id="tab-lab3">
                <span class="tab-num">03</span> Neon Mario
            </button>
            <button class="tab-btn" data-tab="lab4" id="tab-lab4">
                <span class="tab-num">04</span> 歡迎看板
            </button>
        </div>
    </nav>

    <!-- Content Area -->
    <div class="content-area">

        <!-- Home Panel -->
        <div class="home-panel" id="panel-home">
            <canvas id="homeBg"></canvas>
            <div class="home-text">
                <div class="home-badge">IMWEB</div>
                <h1 class="home-title">互動網頁設計</h1>
                <p class="home-sub">點擊下方選擇實驗室</p>
            </div>
            <div class="quick-grid">
                <div class="quick-card" onclick="switchTab('lab1')">
                    <span class="qc-num">LAB 01</span>
                    <span class="qc-icon">🎵</span>
                    <span class="qc-name">流行猜歌王</span>
                </div>
                <div class="quick-card" onclick="switchTab('lab2')">
                    <span class="qc-num">LAB 02</span>
                    <span class="qc-icon">📸</span>
                    <span class="qc-name">照相亭</span>
                </div>
                <div class="quick-card" onclick="switchTab('lab3')">
                    <span class="qc-num">LAB 03</span>
                    <span class="qc-icon">🎮</span>
                    <span class="qc-name">Neon Mario</span>
                </div>
                <div class="quick-card featured" onclick="switchTab('lab4')">
                    <span class="qc-num">LAB 04</span>
                    <span class="qc-icon">✨</span>
                    <span class="qc-name">歡迎看板</span>
                </div>
            </div>
        </div>

        <!-- Lab 1 iframe -->
        <div class="frame-panel" id="panel-lab1">
            <iframe id="iframe-lab1" title="Lab 1 - 流行猜歌王"></iframe>
        </div>

        <!-- Lab 2 iframe -->
        <div class="frame-panel" id="panel-lab2">
            <iframe id="iframe-lab2" title="Lab 2 - 照相亭"></iframe>
        </div>

        <!-- Lab 3 iframe -->
        <div class="frame-panel" id="panel-lab3">
            <iframe id="iframe-lab3" title="Lab 3 - Neon Mario"></iframe>
        </div>

        <!-- Lab 4 iframe -->
        <div class="frame-panel" id="panel-lab4">
            <iframe id="iframe-lab4" title="Lab 4 - 歡迎看板"></iframe>
        </div>

    </div>

    <script>
        /* ── Tab switching ──────────────────────── */
        const iframeLoaded = { lab1: false, lab2: false, lab3: false, lab4: false };
        const iframeSrc = {
            lab1: 'lab1/index.html',
            lab2: 'lab2/index.html',
            lab3: 'lab3/index.html',
            lab4: 'lab4/index.html'
        };

        function switchTab(name) {
            // Update buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === name);
            });

            // Update panels
            document.querySelectorAll('.frame-panel').forEach(p => p.classList.remove('active'));
            const homePanel = document.getElementById('panel-home');
            homePanel.style.display = 'none';

            if (name === 'home') {
                homePanel.style.display = 'flex';
            } else {
                const panel = document.getElementById('panel-' + name);
                if (panel) {
                    panel.classList.add('active');
                    // Lazy-load iframe only when first visited
                    if (!iframeLoaded[name]) {
                        document.getElementById('iframe-' + name).src = iframeSrc[name];
                        iframeLoaded[name] = true;
                    }
                }
            }
        }

        // Bind nav buttons
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        /* ── Home background particles ─────────── */
        (function () {
            const canvas = document.getElementById('homeBg');
            const ctx = canvas.getContext('2d');
            const mouse = { x: null, y: null };
            const pts = [];
            const N = 55, CONN = 110, MR = 150;

            function resize() {
                const dpr = devicePixelRatio || 1;
                const w = canvas.parentElement.offsetWidth;
                const h = canvas.parentElement.offsetHeight;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.scale(dpr, dpr);
            }

            class P {
                constructor() {
                    this.x = Math.random() * innerWidth;
                    this.y = Math.random() * innerHeight;
                    this.vx = (Math.random() - 0.5) * 0.3;
                    this.vy = (Math.random() - 0.5) * 0.3;
                    this.r = Math.random() * 1.8 + 0.8;
                    const c = ['rgba(0,242,254,','rgba(79,172,254,','rgba(161,140,209,','rgba(255,255,255,'];
                    this.color = c[Math.floor(Math.random()*c.length)];
                    this.a = Math.random() * 0.35 + 0.1;
                }
                update(W, H) {
                    if (mouse.x !== null) {
                        const dx = mouse.x - this.x, dy = mouse.y - this.y;
                        const d = Math.hypot(dx, dy);
                        if (d < MR) { const f=(MR-d)/MR; this.vx+=(dx/d)*f*0.006; this.vy+=(dy/d)*f*0.006; }
                    }
                    this.x += this.vx; this.y += this.vy;
                    this.vx *= 0.98; this.vy *= 0.98;
                    const sp = Math.hypot(this.vx,this.vy);
                    if(sp>1.2){this.vx=this.vx/sp*1.2;this.vy=this.vy/sp*1.2;}
                    if(this.x<0)this.x=W; if(this.x>W)this.x=0;
                    if(this.y<0)this.y=H; if(this.y>H)this.y=0;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
                    ctx.fillStyle = this.color + this.a + ')';
                    ctx.fill();
                }
            }

            window.addEventListener('resize', resize);
            canvas.parentElement.addEventListener('mousemove', e => { mouse.x=e.clientX; mouse.y=e.clientY - 70; });
            canvas.parentElement.addEventListener('mouseleave', () => { mouse.x=null; mouse.y=null; });

            resize();
            for (let i = 0; i < N; i++) pts.push(new P());

            function loop() {
                const W = canvas.parentElement.offsetWidth;
                const H = canvas.parentElement.offsetHeight;
                ctx.clearRect(0, 0, W, H);

                // Gradient BG
                const g = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H));
                g.addColorStop(0,'#0c0b24'); g.addColorStop(0.5,'#05040f'); g.addColorStop(1,'#020105');
                ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

                pts.forEach(p => { p.update(W,H); p.draw(); });

                for(let i=0;i<pts.length;i++){
                    for(let j=i+1;j<pts.length;j++){
                        const p1=pts[i],p2=pts[j],d=Math.hypot(p1.x-p2.x,p1.y-p2.y);
                        if(d<CONN){
                            ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
                            ctx.strokeStyle=`rgba(141,169,236,${(1-d/CONN)*0.1})`; ctx.lineWidth=0.7; ctx.stroke();
                        }
                    }
                    if(mouse.x!==null){
                        const p=pts[i],d=Math.hypot(p.x-mouse.x,p.y-mouse.y);
                        if(d<MR){
                            ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(mouse.x,mouse.y);
                            ctx.strokeStyle=`rgba(0,242,254,${(1-d/MR)*0.18})`; ctx.lineWidth=0.8; ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(loop);
            }
            loop();
        })();
    </script>
</body>
</html>
