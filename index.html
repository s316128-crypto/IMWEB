<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMWEB 互動網頁設計</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <div class="page-wrapper">
        <header class="site-header">
            <div class="header-badge">IMWEB</div>
            <h1 class="site-title">互動網頁設計</h1>
            <p class="site-subtitle">選擇一個實驗室開始探索</p>
        </header>

        <main class="lab-grid">
            <a href="lab1/index.html" class="lab-card" id="lab1-card">
                <div class="lab-card-glow"></div>
                <div class="lab-number">01</div>
                <div class="lab-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
                    </svg>
                </div>
                <div class="lab-info">
                    <h2 class="lab-title">Lab 1</h2>
                    <p class="lab-desc">網頁設計基礎實驗</p>
                </div>
                <div class="lab-arrow">→</div>
            </a>

            <a href="lab2/index.html" class="lab-card" id="lab2-card">
                <div class="lab-card-glow"></div>
                <div class="lab-number">02</div>
                <div class="lab-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
                    </svg>
                </div>
                <div class="lab-info">
                    <h2 class="lab-title">Lab 2</h2>
                    <p class="lab-desc">互動效果設計實驗</p>
                </div>
                <div class="lab-arrow">→</div>
            </a>

            <a href="lab3/index.html" class="lab-card" id="lab3-card">
                <div class="lab-card-glow"></div>
                <div class="lab-number">03</div>
                <div class="lab-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
                    </svg>
                </div>
                <div class="lab-info">
                    <h2 class="lab-title">Lab 3</h2>
                    <p class="lab-desc">動畫與視覺實驗</p>
                </div>
                <div class="lab-arrow">→</div>
            </a>

            <a href="lab4/index.html" class="lab-card featured" id="lab4-card">
                <div class="lab-card-glow"></div>
                <div class="lab-badge">最新</div>
                <div class="lab-number">04</div>
                <div class="lab-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                </div>
                <div class="lab-info">
                    <h2 class="lab-title">Lab 4</h2>
                    <p class="lab-desc">歡迎互動看板</p>
                </div>
                <div class="lab-arrow">→</div>
            </a>
        </main>

        <footer class="site-footer">
            <p>IMWEB &copy; 2026 &nbsp;·&nbsp; 互動網頁設計課程</p>
        </footer>
    </div>

    <script src="app.js"></script>

</html>
